<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anatomie Karteikarten</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <main class="app">
        <h1>Anatomie – Latein / Deutsch</h1>
        <div class="info">Leitner-Karteikarten mit 5 Boxen</div>
        <fieldset class="direction-selector">
            <legend>Abfragerichtung</legend>
            <label>
                <input
                    type="radio"
                    name="direction"
                    value="latin-german"
                    checked
                />
                Latein → Deutsch
            </label>
            <label>
                <input
                    type="radio"
                    name="direction"
                    value="german-latin"
                />
                Deutsch → Latein
            </label>
            <label>
                <input
                    type="radio"
                    name="direction"
                    value="random"
                />
                Gemischt (zufällig)
            </label>
        </fieldset>

        <section class="card">
            <div class="direction" id="direction"></div>
            <div class="question" id="question"></div>
            <input
                class="answer-input"
                id="answerInput"
                type="text"
                placeholder="Antwort eingeben"
                autocomplete="off"
            />
            <div class="answer-feedback" id="answerFeedback"></div>
            <div class="answer" id="answer"></div>
            <button id="showAnswerBtn">Antwort prüfen</button>
        </section>
        <div class="status" id="status"></div>

        <br>
        <div class="boxes" id="boxes"></div>
        <div class="reset-controls">
            <button id="resetProgressBtn" class="reset-progress-btn" type="button">
                Lernfortschritt zurücksetzen
            </button>
        </div>

        <hr class="section-divider" />

        <h1>Wochenmodus</h1>
        <div class="info">
            Fällige Karten nach Wochentag: täglich Box 1, Di/Do Box 1–4,
            am Wochenende Box 1 + 5
        </div>

        <section class="card">
            <div class="direction" id="weeklyDirection"></div>
            <div class="question" id="weeklyQuestion"></div>
            <input
                class="answer-input"
                id="weeklyAnswerInput"
                type="text"
                placeholder="Antwort eingeben"
                autocomplete="off"
            />
            <div class="answer-feedback" id="weeklyAnswerFeedback"></div>
            <div class="answer" id="weeklyAnswer"></div>
            <button id="weeklyShowAnswerBtn">Antwort prüfen</button>
        </section>
        <div class="status" id="weeklyStatus"></div>

        <br>
        <div class="group-tiles" id="weeklyGroups"></div>
        <div class="reset-controls">
            <button id="weeklyResetProgressBtn" class="reset-progress-btn" type="button">
                Lernfortschritt zurücksetzen
            </button>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>
</html>
